<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mood to Color — demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=11" />
    <link rel="preload" href="./data/mindful-palettes.json" as="fetch" crossorigin />
    <link rel="preload" href="./data/pinterest-colors.json" as="fetch" crossorigin />
  </head>
  <body>
    <header>
      <h1>Mood to Color — palette matcher</h1>
      <p class="sub">Pick <strong>one</strong> mood tag to rank palettes.</p>
    </header>
    <main>
      <section aria-labelledby="moods-label">
        <h2 id="moods-label">Mood tags (24)</h2>
        <div id="chips" class="chips" role="radiogroup" aria-labelledby="moods-label"></div>
      </section>
      <section aria-labelledby="out-label">
        <h2 id="out-label">Matching palettes</h2>
        <p id="status" class="meta-bar" aria-live="polite"></p>
        <div id="results" class="grid"></div>
        <p id="err" class="error" hidden></p>
      </section>
    </main>
    <script src="./mood-engine-v2.js"></script>
    <script src="./app.js?v=12" defer></script>
  </body>
</html>
